stages:
  - build_and_push
  - update_manifest

variables:
  REGISTRY: "192.168.95.101:5000"
  # SỬA DÒNG NÀY: Phải là [Namespace]/[Project-Name]
  IMAGE_NAME: "root/wedding"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  REGISTRY_USER: "root"
  REGISTRY_PASSWORD: "glpat-fnkG9siRafwhtxecizzH"

build_and_push:
  stage: build_and_push
  image: docker:latest
  script:
    - echo "$REGISTRY_PASSWORD" | docker login ${REGISTRY} -u ${REGISTRY_USER} --password-stdin
    - docker build -t ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} .
    - docker tag ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} ${REGISTRY}/${IMAGE_NAME}:latest
    - docker push ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${REGISTRY}/${IMAGE_NAME}:latest
  only:
    - main
    - develop

update_manifest:
  stage: update_manifest
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    # Cấu hình Git để có thể commit
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
  script:
    - 'sed -i "s|image: ${REGISTRY}/${IMAGE_NAME}:.*|image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}|g" k8s/deployment.yaml'    
    # Commit và Push ngược lại repo
    - git add k8s/deployment.yaml
    - git commit -m "Update image tag to ${IMAGE_TAG} [skip ci]" || true # [skip ci] để tránh lặp vô tận
    # Bạn cần một Project Access Token có quyền write_repository để push
    - git push http://oauth2:${GITLAB_ACCESS_TOKEN}@192.168.95.101/root/wedding.git HEAD:main || true
  only:
    - main
