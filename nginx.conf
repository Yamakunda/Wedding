server {
    listen 80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 1. Bật Gzip (Rất quan trọng cho frontend để giảm dung lượng tải)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 2. Caching cho các file Build của Next.js (_next/static)
    # Các file này có mã hash (vd: chunk.a8b1c.js) nên CÓ THỂ cache vĩnh viễn (1 năm).
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off; # Tắt log để đỡ rác file log
    }

    # 3. Caching cho hình ảnh/media thông thường
    # Cache 1 tháng (hoặc tùy nhu cầu)
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # 4. Cấu hình cho HTML (Entry Point)
    # Đây là nơi user vào đầu tiên. KHÔNG ĐƯỢC CACHE (hoặc cache revalidate)
    # Nếu cache file này, user sẽ không nhận được bản update mới khi bạn deploy.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        
        # no-cache: Trình duyệt vẫn lưu cache, nhưng phải hỏi server xem có file mới không trước khi dùng.
        # no-store: Không lưu cache gì cả (an toàn nhất cho file index.html).
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}